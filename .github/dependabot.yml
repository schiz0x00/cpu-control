version: 2
updates:
  # One grouped pull request a month, so the large GUI dependency tree
  # does not turn into a stream of single-crate bumps.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Its refs are Rust version numbers, not releases of the action. The
      # pinned toolchain in ci.yml is raised by hand, with any clippy fixes.
      - dependency-name: dtolnay/rust-toolchain
