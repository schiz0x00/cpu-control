[package]
name = "cpu-control"
version = "0.1.0"
edition = "2024"
# The GUI dependency (eframe 0.37) sets the floor; 1.96 and 1.99 are what has actually been run.
rust-version = "1.95"
description = "Take CPU threads and core groups offline and tune cpufreq on Linux, via sysfs (CLI, TUI and GUI)"
repository = "https://github.com/schiz0x00/cpu-control"
readme = "README.md"
keywords = ["cpu", "linux", "sysfs", "hotplug", "cpufreq"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
eframe = "0.37.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
